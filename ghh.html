<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image and Content Layout</title>
    <link rel="stylesheet" href="gh.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: start;
            align-items: flex-start;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1300px;
            width: 100%;
        }

        .image-box {
            width: 250px;
            height: 300px;
            border: 2px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f9f9f9;
        }

        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        .content-box {
            flex: 1;
            height: 260px;
            border: 2px solid #ccc;
            padding: 20px;
            background-color: #f9f9f9;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="image-box"> <img src="C:\new project\Project_IMF\tiger.jpg" alt=" photo ">
        </div>
        <div class="content-box">
            <h2>DESCRIPTION</h2>
            <p>This is a rectangular box for text or other content. You can add paragraphs, lists, or any HTML elements
                here.</p>
        </div>
    </div>
</body>
</html>
