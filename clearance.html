<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearance Verification</title>

    <link rel="stylesheet" href="clearance.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <div class="scanlines"></div>

    <div class="login-container">
        <h1>Clearance Verification</h1>

        <form id="loginForm">
            <input type="text" id="agent" placeholder="Agent Name" required>
            <input type="password" id="key" placeholder="Agent Key Code" required>

            <button type="submit">Verify Identity</button>
        </form>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
